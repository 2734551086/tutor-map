name: Keep Railway Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway health endpoint
        run: |
          curl -sf -o /dev/null --max-time 30 https://tutor-api-production-8f83.up.railway.app/api/health || echo "PING_FAILED"